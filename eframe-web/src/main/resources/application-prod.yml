# 开发环境配置
server:
    # 服务器的HTTP端口，默认为8310
    port: 8310
    servlet:
        # 应用的访问路径
        context-path: /eframe_backend
    tomcat:
        # tomcat的URI编码
        uri-encoding: UTF-8
        # 连接数满后的排队数，默认为100
        accept-count: 1000
        threads:
            # tomcat最大线程数，默认为200
            max: 800
            # Tomcat启动初始化的线程数，默认值10
            min-spare: 100

# 日志配置
logging:
    level:
        net.linlan: debug
        org.springframework: warn

# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            first: #数据源1-产品数据源
                url: ENC(VtQCCE6cDu4s8PrtSVPfzsxKMb0QnCjYHFSwS/xRukWg4lJ5O66tBu/kyZxlHF/kpOlkeLmybXW9/Ax9V0uXCQ0IBypHD7S85Qf73wud8w9pRCKUG/uUI5Rqcr2a4w4LpU+2JkC+F/2KTgLh2e3tNv275qFzPJO1MpTOwP3C62pO0TMoqr2skhdqfTLwwHe5akMM1CGeuiPWeUM/WNg3NgetohKJ1ZrBbQkvuRsgkWHcKSohvKOfpUTbTQNl3hecEkGzs4vDin6oNLpTWtMZd7pH5906pI6c)
                username: ENC(AFMlrHtGTsgv1996ntwDTw==)
                password: ENC(RlZ72w8B5tePqOYBeIp6aNSctMB3d00C)
            h2: #数据源-H2本地数据库
                url: jdbc:h2:~/H2Data/lldb;AUTO_SERVER=TRUE;LOG=0;UNDO_LOG=0
                username: sa
                password:
            second: #数据源2-业务主要数据库
                # 从数据源开关/默认关闭
                enabled: false
                url: jdbc:mysql://localhost:3306/eframedb_1.0?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true
                username: 'lldba'
                password: 'DB_Lldba_2023!'

            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                enabled: true
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true

    # redis 配置
    redis:
        # 地址
        host: ENC(JhPS01GkvgppVXjOvqXeGiASep0iPwzD)
        # 端口，默认为6379
        port: 6379
        # 数据库索引
        database: 1
        # 密码
        password:
        # 连接超时时间
        timeout: 10s
        lettuce:
            pool:
                # 连接池中的最小空闲连接
                min-idle: 0
                # 连接池中的最大空闲连接
                max-idle: 8
                # 连接池的最大数据库连接数
                max-active: 8
                # #连接池最大阻塞等待时间（使用负值表示没有限制）
                max-wait: -1ms
# 文件路径配置
platform:
    file:
        dir: /data/files/eframe
    prop:
        allowedOrigins: "*"
    database:
        db_encrypt: true        #数据库敏感信息是否加密
        db_key: Linlan_@!DB_Key        #数据库敏感字段加密值
        db_key_out: lldb_string_out        #数据库敏感字段对外提供加密值