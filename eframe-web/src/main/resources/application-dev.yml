# 开发环境配置
server:
    # 服务器的HTTP端口，默认为8080
    port: 8081
    servlet:
        # 应用的访问路径
        context-path: /eframe_backend/
    tomcat:
        # tomcat的URI编码
        uri-encoding: UTF-8
        # 连接数满后的排队数，默认为100
        accept-count: 1000
        threads:
            # tomcat最大线程数，默认为200
            max: 800
            # Tomcat启动初始化的线程数，默认值10
            min-spare: 100

# 日志配置
logging:
    level:
        net.linlan: debug
        org.springframework: warn

# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        #        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            first: #数据源1-产品数据源
                url: jdbc:mysql://localhost:3306/eframedb_1.0?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&&autoReconnect=true&failOverReadOnly=false&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
                username: 'lldba'
                password: 'DB_Lldba_2023!'
            h2: #数据源-H2本地数据库
                url: jdbc:h2:~/H2Data/lldb;AUTO_SERVER=TRUE;LOG=0;UNDO_LOG=0
                username: sa
                password:
            second: #数据源2-业务主要数据库
                # 从数据源开关/默认关闭
                enabled: false
                url: jdbc:mysql://localhost:3306/eframedb_1.0?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&&autoReconnect=true&failOverReadOnly=false&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
                username: 'lldba'
                password: 'DB_Lldba_2023!'

            initial-size: 10
            max-active: 100
            min-idle: 10
            max-wait: 60000
            pool-prepared-statements: true
            max-pool-prepared-statement-per-connection-size: 20
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1 FROM DUAL
            test-while-idle: true
            test-on-borrow: false
            test-on-return: false
            stat-view-servlet:
                enabled: true
                url-pattern: /druid/*
            filter:
                stat:
                    log-slow-sql: true
                    slow-sql-millis: 4000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true

    # redis 配置
    redis:
        # 地址
        host: localhost
        # 端口，默认为6379
        port: 6379
        # 数据库索引
        database: 0
        # 密码
        password:
        # 连接超时时间
        timeout: 10s
        lettuce:
            pool:
                # 连接池中的最小空闲连接
                min-idle: 5
                # 连接池中的最大空闲连接
                max-idle: 10
                # 连接池的最大数据库连接数
                max-active: 1000
                # #连接池最大阻塞等待时间（使用负值表示没有限制）
                max-wait: 0ms

# 文件路径配置
platform:
    file:
        dir: d:/eframe/
    prop:
        allowedOrigins: "*"
    database:
        db_encrypt: false        #数据库敏感信息是否加密
        db_key: encrypt_string        #数据库敏感字段加密值
        db_key_out: encrypt_string_out        #数据库敏感字段对外提供加密值
    backend:
        encrypt: false      #前后端交互是否加密
        rsa:
            # 前后端交互RSA2048公钥、私钥配置
            public_key:
            private_key:
